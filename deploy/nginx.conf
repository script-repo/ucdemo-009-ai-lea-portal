server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    resolver 10.96.0.10 valid=30s ipv6=off;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/nai/ {
        proxy_pass https://nai.hpoc.nutanix.com/api/v1/;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Host nai.hpoc.nutanix.com;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Content-Type $http_content_type;
        proxy_read_timeout 120s;
        proxy_connect_timeout 15s;
    }

    location /api/openrouter/ {
        proxy_pass https://openrouter.ai/api/v1/;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Host openrouter.ai;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Content-Type $http_content_type;
        proxy_set_header HTTP-Referer $http_referer;
        proxy_set_header X-Title $http_x_title;
        proxy_read_timeout 120s;
        proxy_connect_timeout 15s;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
