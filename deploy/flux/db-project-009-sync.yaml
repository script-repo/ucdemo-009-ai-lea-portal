apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: ucdemo-009-ai-lea-portal
  namespace: db-project-009
spec:
  interval: 1m
  url: https://github.com/script-repo/ucdemo-009-ai-lea-portal.git
  ref:
    branch: main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ucdemo-009-ai-lea-portal
  namespace: db-project-009
spec:
  interval: 1m
  retryInterval: 30s
  timeout: 3m
  sourceRef:
    kind: GitRepository
    name: ucdemo-009-ai-lea-portal
  path: ./deploy/gitops/db-project-009
  prune: true
  wait: true
  targetNamespace: db-project-009
